name: iRx modern build and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python tools
        run: |
          python3 -m py_compile master_server/server.py tools/cubescript_obf.py tools/server_content_cache.py tools/discord_rpc.py tools/xp_tool.py
          python3 tools/cubescript_obf.py config/irx_modern.cfg -o /tmp/irx_modern.min.cfg
          python3 tools/xp_tool.py --db /tmp/irx-xp.sqlite3 award ci-player 500 --reason ci --name CI >/tmp/xp.json
          python3 tools/xp_tool.py --db /tmp/irx-xp.sqlite3 profile ci-player

  linux64:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev zlib1g-dev libogg-dev libvorbis-dev libopenal-dev libcurl4-openssl-dev zip
      - name: Enable production build
        run: sed -i 's@//#define PRODUCTION@#define PRODUCTION@' source/src/cube.h
      - name: Build client and server
        run: |
          cd source/src
          make clean
          make -j2
          make install
          cd ../..
      - name: Package release
        run: |
          set -e
          mkdir -p dist/irx-modern-linux64
          cp bin_unix/native_client dist/irx-modern-linux64/irx_client
          cp bin_unix/native_server dist/irx-modern-linux64/irx_server
          cp -r config dist/irx-modern-linux64/config
          cp -r master_server dist/irx-modern-linux64/master_server
          cp -r tools dist/irx-modern-linux64/tools
          cp README.md dist/irx-modern-linux64/ || true
          chmod 750 dist/irx-modern-linux64/irx_client dist/irx-modern-linux64/irx_server
          cd dist
          zip -qr irx-modern-linux64.zip irx-modern-linux64
      - uses: actions/upload-artifact@v4
        with:
          name: irx-modern-linux64
          path: dist/irx-modern-linux64.zip

  release:
    if: github.event_name == 'push'
    needs: linux64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: irx-modern-linux64
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="modern-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          gh release create "$TAG" dist/irx-modern-linux64.zip --target "$GITHUB_SHA" --title "iRx Modern ${SHORT_SHA}" --notes "Automated iRx modernization build. Includes all-weapon right-click ADS, competitive HUD preset and hit feedback defaults, server-side ACAC validation hooks, irautox.ir:7575 master routing and hardened Python master server, Discord RPC bridge for app 1534574125790658722, safe per-server content cache, CubeScript minifier/obfuscator, and SQLite XP progression tooling."
