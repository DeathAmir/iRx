// iRx Shooter modernization layer. Loaded from autoexec.cfg after stock scripts.

exec config/irx_ui.cfg
exec config/irx_audio.cfg

irx_ads_fov = 58
irx_ads_active = 0
irx_ads_savedfov = 90

const irx_ads [
    if $arg1 [
        if (! $irx_ads_active) [
            irx_ads_savedfov = $fov
            fov $irx_ads_fov
            irx_ads_active = 1
        ]
    ] [
        if $irx_ads_active [
            fov $irx_ads_savedfov
            irx_ads_active = 0
        ]
    ]
]

// MOUSE2 already dispatches to altaction. Replace the old per-gun quick-nade
// default with hold-to-ADS for every weapon, while preserving native sniper scope.
loop i $NUM_WEAPONS [
    (concatword altaction_ $i) = [ irx_ads 1; onrelease [ irx_ads 0 ] ]
]
(format altaction_%1 (getgunindex sniper)) = [ setscope 1; onrelease [ setscope 0 ] ]

// Dedicated smoke throw. Mobile uses the same command from its touch action.
bind V [ irxsmoke ]

// Strong hit confirmation while keeping the server-authoritative damage path.
hitsound 2

const irx_ads_reset [
    if $irx_ads_active [ fov $irx_ads_savedfov ]
    irx_ads_active = 0
]
addOnLoadAlways irx_ads_reset
addOnQuit irx_ads_reset

const irx_competitive_ui [
    showminremain 1
    showallplayersnumber 1
    serversortpreferofficial 1
]
irx_competitive_ui
